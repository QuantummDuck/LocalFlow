# mlx_lm lora -c lora.yaml --model <hf> --adapter-path adapters/<name>
train: true
data: train
fine_tune_type: lora
mask_prompt: true
num_layers: -1
batch_size: 4
iters: 600
learning_rate: 1.0e-4
max_seq_length: 1024
grad_checkpoint: true
steps_per_report: 25
steps_per_eval: 150
val_batches: 12
save_every: 300
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
